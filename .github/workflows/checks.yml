# Independent circuit checker, the XORFlux and BoolFlux test suites and the hardware benchmark's
# unit tests, on every push and pull request.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  circuits:
    name: circuit checker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every circuit, linear and Boolean, and NIST's seeds (standard library only, no search code)
        run: python3 circuits/check.py
      - name: Checker library tests (circuits/boolcirc)
        run: python3 -m unittest discover -s circuits/boolcirc/tests -t circuits

  xorflux:
    name: XORFlux tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest   # 4 vCPUs
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (includes the second verifier over every XOR-only circuit)
        run: python3 -m unittest discover -s search/linear/xorflux/tests -t search/linear

  boolflux:
    name: BoolFlux tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independent verifier tests
        run: python3 -m unittest discover -s search/nonlinear/boolflux/independent
      - name: BoolFlux tests (builds the C kernels with gcc)
        run: python3 -m unittest discover -s search/nonlinear/boolflux/tests -t search/nonlinear
      - name: Hub tests
        run: python3 -m unittest discover -s search/nonlinear/boolflux/hub/tests -t search/nonlinear

  hardware:
    name: hardware benchmark tests (no EDA tools)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: hwbench unit tests (the tests that need Yosys/OpenROAD skip themselves)
        run: python3 -m unittest discover -s hardware/tests -t hardware -v
      - name: Research tests (structure hash, pipeline manifest, fingerprints, exit status)
        run: python3 -m unittest discover -s hardware/research/tests -t hardware/research -v
