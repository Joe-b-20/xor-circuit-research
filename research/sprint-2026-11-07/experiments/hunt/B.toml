# Hunt arm B: arm A with short stall timers. Hypothesis: time at a sealed 88 plateau beyond a
# few minutes is wasted (plateaus are small closed products; +1 exits lead home or to other 88s),
# so restarting sooner gives more independent descents per worker-hour at the same per-descent
# success rate.

[campaign]
name = "hunt-B-shortstall"
seed = 20261107
duration = "8h"
profiles = ["default"]
sharing = "off"

[set]
"scheduler.reference" = [[97, 3], [89, 4], [88, 5]]
"engine.records_per_point" = 100000
"engine.record_stride" = 4096
"worker.records_per_point" = 100000
"restart.w_fresh" = 1.0
"restart.w_elite" = 0.0
"restart.w_shared" = 0.0
"restart.w_best" = 0.0
"restart.stall_seconds" = 300.0
"restart.incumbent_factor" = 1.0

[[workers]]
name = "free"
target = "aes-mixcolumns"
count = 6
objective = "gates"
depth_cap = "none"
seeds = ["root"]
