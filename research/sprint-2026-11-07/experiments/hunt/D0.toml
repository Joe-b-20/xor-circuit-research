# Hunt D, arm D0: v8 defaults (= arm A), concurrent control for D4 and DN.  13 h, 4 workers.
# Outcome measures (descents.py / sig.py on samplesD): chains reaching 88, arrivals at 89 and 88
# per worker-hour, distinct 88 signatures per worker-hour; and an 87 lottery.

[campaign]
name = "hunt-D0-default"
seed = 20261108
duration = "13h"
profiles = ["default"]
sharing = "off"

[set]
"scheduler.reference" = [[97, 3], [89, 4], [88, 5]]
"engine.records_per_point" = 100000
"engine.record_stride" = 4096
"worker.records_per_point" = 100000
"restart.w_fresh" = 1.0
"restart.w_elite" = 0.0
"restart.w_shared" = 0.0
"restart.w_best" = 0.0

[[workers]]
name = "free"
target = "aes-mixcolumns"
count = 4
objective = "gates"
depth_cap = "none"
seeds = ["root"]
